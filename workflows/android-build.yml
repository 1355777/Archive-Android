name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and create build information
        shell: bash
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p build-output
          cp "$APK" build-output/ArchiveRegister-debug.apk
          sha256sum build-output/ArchiveRegister-debug.apk > build-output/SHA256SUMS.txt
          {
            echo "Application: سجل الأرشيف"
            echo "Build type: debug"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Built at (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "APK: ArchiveRegister-debug.apk"
          } > build-output/BUILD-INFO.txt
          ls -lh build-output

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ArchiveRegister-Android-APK
          path: build-output/*
          if-no-files-found: error
          retention-days: 30
